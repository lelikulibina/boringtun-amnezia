[package]
name = "boringtun-amnezia"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "WireGuard and AmneziaWG protocol implementation in Rust"

[lib]
name = "boringtun_amnezia"
path = "src/lib.rs"

[features]
default = ["wireguard", "amneziawg"]
wireguard = []
amneziawg = ["wireguard"]
amneziawg-3-0 = ["amneziawg"]
amneziawg-3-1 = ["amneziawg"]

[dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
chacha20 = "0.9.1"
# Use the published, versioned upstream library rather than unstable master.
boringtun = { version = "=0.7.1", default-features = false }
