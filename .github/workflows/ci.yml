name: CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Проверка Rust
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить стабильный Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Запустить тесты
        run: cargo test --workspace --all-features
      - name: Проверить матрицу feature flags
        run: |
          cargo test --workspace --no-default-features
          cargo test --workspace --no-default-features --features wireguard
          cargo test --workspace --no-default-features --features amneziawg-3-0
          cargo test --workspace --no-default-features --features amneziawg-3-1
      - name: Проверить Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
